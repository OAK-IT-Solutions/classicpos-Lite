name: Build ClassicPOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            backend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install desktop dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: 'ClassicPOS Desktop v__VERSION__'
          releaseBody: |
            ## ClassicPOS Desktop
            
            ### Windows Installers
            - **NSIS Installer** (.exe) — recommended for most users
            - **MSI Installer** (.msi) — for enterprise deployment
            
            ### System Requirements
            - Windows 10+ (x64)
            - 4GB RAM
            - 200MB disk space
            
            ### What's Included
            - Tauri v2 native shell
            - Static PHP binary (embedded)
            - Laravel 12 backend
            - SQLite database (zero config)
            - USB/Serial receipt printing
            - Cash drawer control
            - Auto-updater
            - License system
            - Cloudflare Tunnel support
          releaseDraft: true
          prerelease: false
