name: Build ClassicPOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check PHP binary exists
        run: |
          if (!(Test-Path "src-tauri\binaries\php-x86_64-pc-windows-msvc.exe")) {
            Write-Error "PHP binary not found"
            exit 1
          }
          $size = (Get-Item "src-tauri\binaries\php-x86_64-pc-windows-msvc.exe").Length / 1MB
          Write-Host "PHP binary found: $([math]::Round($size,1)) MB"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: 'ClassicPOS Desktop v__VERSION__'
          releaseBody: |
            ## ClassicPOS Desktop v__VERSION__
            
            ### Download
            - **Windows**: ClassicPOS-Setup.exe (NSIS installer)
            
            ### System Requirements
            - Windows 10+ 
            - 4GB RAM, 200MB disk space
            
            ### Note
            macOS and Linux builds coming soon.
          releaseDraft: true
          prerelease: false
