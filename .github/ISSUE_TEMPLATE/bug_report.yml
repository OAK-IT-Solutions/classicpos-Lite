name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or error logs to help explain the problem.

  - type: input
    id: version
    attributes:
      label: ClassicPOS Version
      description: What version or commit hash are you running?
      placeholder: v1.0.0 or git commit abc123

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Docker (self-hosted)
        - ClassicPOS Cloud (hosted)
        - Manual installation
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if applicable)
      description: What browser are you using?
      placeholder: Chrome 120, Firefox 121

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem.
